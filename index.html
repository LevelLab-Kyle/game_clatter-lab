<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Match the device's light or dark setting, and follow it if it changes.
      (function () {
        var light = window.matchMedia && matchMedia('(prefers-color-scheme: light)');
        function apply() { document.documentElement.setAttribute('data-theme', light && light.matches ? 'light' : 'dark'); }
        apply();
        if (light && light.addEventListener) light.addEventListener('change', apply);
      })();
      // In the iOS / Android app (Capacitor's bridge is already loaded here), the
      // tray runs right down to the screen's bottom edge: see .in-app in style.css.
      if (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) {
        document.documentElement.classList.add('in-app');
      }
    </script>
    <title>Clatter Lab</title>
    <link rel="preload" href="assets/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The ?v= on each local file is a cache buster: /deploy swaps the placeholder for the commit hash. -->
    <link rel="stylesheet" href="src/style.css?v=__VERSION__" />
  </head>
  <body class="loading">
    <div id="app">
      <header id="topbar">
        <div class="level-info">
          <button id="btn-levels" class="button" title="Pick a Level" aria-label="Pick a Level"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="4" height="4" rx="0.75"/><rect x="9.5" y="2.5" width="4" height="4" rx="0.75"/><rect x="2.5" y="9.5" width="4" height="4" rx="0.75"/><rect x="9.5" y="9.5" width="4" height="4" rx="0.75"/></svg></button>
          <span id="level-title" class="level-title"></span>
        </div>
        <div class="examples">
          <label for="examples" class="muted">Examples</label>
          <select id="examples"></select>
        </div>
        <div id="brand" aria-hidden="true">Clatter Lab</div>
        <button id="btn-share" class="button-icon" title="Share Your Board" aria-label="Share" hidden><svg viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10V2"/><path d="M5 5l3-3 3 3"/><path d="M3.5 8.5v5h9v-5"/></svg></button>
        <button id="btn-menu" class="button" title="Menu" aria-expanded="false" aria-controls="menu-panel"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>Menu</button>
      </header>

      <div id="stage">
        <canvas id="scene"></canvas>
        <div id="loader" role="status"><div class="spinner"></div>Loading…</div>
        <div id="view-tools">
          <button id="btn-home" class="button-icon" title="Fit Everything on Screen (H)" aria-label="Home"><svg viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7.5L8 2.5l6 5"/><path d="M3.5 6.5V13.5h9V6.5"/><path d="M6.5 13.5v-4h3v4"/></svg></button>
          <button id="btn-clear" class="button-icon" title="Clear the Board" aria-label="Clear"><svg viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11"/><path d="M6 4V2.5h4V4"/><path d="M4 4l.75 9.5h6.5L12 4"/><path d="M6.75 6.5v4.5M9.25 6.5v4.5"/></svg></button>
          <button id="btn-hint" class="button-icon" title="What do I do? (show the hint)" aria-label="Show the Hint">?</button>
          <div id="clear-confirm" class="card" hidden>
            <div class="title">Are you sure?</div>
            <div id="clear-text" class="muted"></div>
            <div class="confirm-buttons">
              <button id="clear-cancel" class="button">Cancel</button>
              <button id="clear-yes" class="button button-danger">Clear</button>
            </div>
          </div>
        </div>
        <div id="run-tools">
          <button id="btn-undo" class="button-icon" title="Undo (Cmd/Ctrl+Z)" aria-label="Undo" disabled><svg viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3L2.5 6l3 3"/><path d="M2.5 6H10a3.5 3.5 0 0 1 0 7H7"/></svg></button>
          <button id="btn-redo" class="button-icon" title="Redo (Shift+Cmd/Ctrl+Z)" aria-label="Redo" disabled><svg viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 3l3 3-3 3"/><path d="M13.5 6H6a3.5 3.5 0 0 0 0 7h3"/></svg></button>
          <button id="btn-play" class="button-icon" title="Play (Space)" aria-label="Play"><svg class="icon-play" viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M4.5 2.5v11l9-5.5z"/></svg><svg class="icon-stop" viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg></button>
        </div>
        <div id="item-tools" hidden>
          <button id="tool-rotate" class="button-icon" title="Rotate (R)"><svg viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M12 1.5v3h-3"/></svg></button>
          <button id="tool-size" class="button-icon" title="Size (S)"><svg viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 14L14 2"/><path d="M9 2h5v5"/><path d="M7 14H2V9"/></svg></button>
          <button id="tool-flip" class="button-icon" title="Flip (F)"><svg viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v12"/><path d="M6 4L2 12h4z"/><path d="M10 4l4 8h-4z"/></svg></button>
          <button id="tool-delete" class="button-icon" title="Delete">🗑</button>
        </div>
        <button id="play-badge" type="button" tabindex="-1" aria-label="Stop"><svg class="badge-icon" viewBox="0 0 16 16" fill="currentColor" aria-label="Play"><path d="M4.5 2.5v11l9-5.5z"/></svg> Playing, press <svg class="badge-icon" viewBox="0 0 16 16" fill="currentColor" aria-label="Stop"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg> to edit</button>
        <div id="toast" hidden></div>
        <div id="coach" hidden></div>
        <div id="locked-tag" hidden><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg> Can’t Move</div>
        <div id="hint" class="card" role="dialog" aria-labelledby="hint-title" hidden>
          <div id="hint-title" class="title"></div>
          <div id="hint-text"></div>
        </div>
        <div id="cloud-card" class="card" role="dialog" aria-labelledby="cloud-title" hidden>
          <div id="cloud-title" class="title"></div>
          <div id="cloud-text" class="muted"></div>
          <div class="confirm-buttons">
            <button id="cloud-no" class="button"></button>
            <button id="cloud-yes" class="button button-accent"></button>
          </div>
        </div>
        <div id="win-card" class="card" hidden>
          <div class="win-star">⭐</div>
          <div id="win-title" class="title"></div>
          <div id="win-text" class="muted"></div>
          <div class="win-buttons">
            <button id="win-again" class="button">↺ Try Again</button>
            <button id="win-next" class="button button-accent"></button>
          </div>
        </div>
      </div>

      <footer id="tray">
        <div class="tray-row">
          <button id="tray-prev" class="button-icon" title="Previous Gadgets">‹</button>
          <div id="gadget-list"><div id="gadget-track"></div></div>
          <button id="tray-next" class="button-icon" title="More Gadgets">›</button>
        </div>
      </footer>
      <!-- The level picker covers the whole screen, like the menu. -->
      <div id="level-picker" role="dialog" aria-modal="true" aria-label="Levels" hidden>
        <div class="picker-panel card">
          <div class="picker-head">
            <button id="world-prev" class="button-icon" title="Previous World" aria-label="Previous World">‹</button>
            <div id="world-title" class="title" aria-live="polite"></div>
            <button id="world-next" class="button-icon" title="Next World" aria-label="Next World">›</button>
            <button id="picker-close" class="button-icon" title="Close" aria-label="Close">✕</button>
          </div>
          <div id="level-grid"></div>
          <div id="world-dots" aria-hidden="true"></div>
        </div>
      </div>
      <!-- The menu: slides in from the right (main.js). The Account part
           shows only once Level Lab answers (studio.js). -->
      <div id="menu">
        <div id="menu-backdrop"></div>
        <aside id="menu-panel" role="dialog" aria-modal="true" aria-labelledby="menu-title" tabindex="-1">
          <div class="menu-head">
            <div id="menu-title" class="title">Menu</div>
            <button id="menu-close" class="button-icon" title="Close" aria-label="Close">✕</button>
          </div>
          <section id="menu-account" class="menu-section" hidden>
            <div class="menu-label">Account</div>
            <div id="account-title" class="menu-name"></div>
            <div id="account-text" class="muted"></div>
            <button id="account-button" class="button"></button>
          </section>
          <section class="menu-section">
            <div class="menu-label">Play</div>
            <nav id="modes" class="modes">
              <button id="mode-levels" class="mode" data-mode="levels">Levels</button>
              <button id="mode-sandbox" class="mode" data-mode="sandbox">Sandbox</button>
            </nav>
          </section>
          <section class="menu-section">
            <div class="menu-label">Game</div>
            <button id="set-sound" class="menu-row" role="switch" aria-checked="true"><span>Sound Effects</span><span class="switch" aria-hidden="true"></span></button>
            <button id="set-lock" class="menu-row" role="switch" aria-checked="true"><span>Lock Up and Down</span><span class="switch" aria-hidden="true"></span></button>
          </section>
        </aside>
      </div>
    </div>
    <script src="vendor/libs.js?v=__VERSION__"></script>
    <script src="assets/sounds.js?v=__VERSION__"></script>
    <script src="src/gadgets.js?v=__VERSION__"></script>
    <script src="src/examples.js?v=__VERSION__"></script>
    <script src="src/levels.js?v=__VERSION__"></script>
    <script src="src/main.js?v=__VERSION__"></script>
    <script src="src/studio.js?v=__VERSION__"></script>
  </body>
</html>
